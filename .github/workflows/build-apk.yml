name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev lld

      - name: Install buildozer
        run: pip install --upgrade buildozer "cython<3" setuptools

      # Android SDK/NDK 다운로드(수 GB)를 다음 빌드부터 재사용
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-home-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-home-${{ runner.os }}-

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lotto-offline-apk
          path: bin/*.apk
          if-no-files-found: error
